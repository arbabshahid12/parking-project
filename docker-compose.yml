version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: parking-postgres
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper
  zookeeper:
    image: zookeeper:3.8 # Updated to a more stable tag
    container_name: parking-zookeeper
    ports:
      - "2182:2181"
    healthcheck:
      # Fixed syntax: added ["CMD-SHELL", ...] to ensure it runs correctly in Docker
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: parking-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Backend (Spring Boot)
  backend:
    build:
      # FIX: Your images show the backend project is in './backend/parking'
      context: ./backend/parking
      dockerfile: Dockerfile
    container_name: parking-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # Added 'healthcheck' only if you have Spring Boot Actuator installed
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # Frontend (React/Vite)
  frontend:
    build:
      # FIX: Updated to match your path 'frontend/smart-slot-insight'
      context: ./frontend/smart-slot-insight
      dockerfile: Dockerfile
    container_name: parking-frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data: